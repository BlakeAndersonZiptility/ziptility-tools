name: Release Formula Sheets
# The formula-sheets bundle (/tools/formula-sheets) ships on its own tag family, off the
# operator calculator's release train, so the page's cadence stays its own.
#
# Two ways to cut a release (both end up identical):
#   1. Actions tab -> Release Formula Sheets -> "Run workflow" -> enter the tag.
#   2. git tag sheets-v1.0.0 && git push origin sheets-v1.0.0
# The workflow tests, builds dist/sheets-vX.Y.Z.js (immutable, never
# overwritten), commits it to main, and creates a GitHub Release.
# Deploying = pointing each page's embed script src at the new file. Merging
# to main never changes what a visitor sees.
on:
  push:
    tags: ['sheets-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (sheets-vX.Y.Z, e.g. sheets-v1.0.0)'
        required: true
permissions:
  contents: write
env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate tag and create it (manual runs only)
        run: |
          if ! echo "${TAG}" | grep -Eq '^sheets-v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag '${TAG}' must look like sheets-v1.0.0"; exit 1
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              echo "Tag ${TAG} already exists, versions are immutable"; exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "${TAG}"
            git push origin "${TAG}"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:sheets
      - name: Neutral-lane rules and sandbox safety
        run: node scripts/check-neutral-lane.mjs src/sheets
      - run: npm run build:sheets:dev && npm run build:sheets:preview
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests (the rendered run, incl. the completion payload)
        run: node tests/sheets-browser.test.js
      - name: Build versioned artifact
        run: |
          if [ -f "dist/${TAG}.js" ]; then
            echo "dist/${TAG}.js already exists, versions are immutable"; exit 1
          fi
          npx esbuild src/sheets/main.js --bundle --format=iife --loader:.css=text --minify \
            --banner:js="/* Ziptility Formula Sheets ${TAG} (${GITHUB_SHA}) https://github.com/${GITHUB_REPOSITORY} */" \
            --outfile="dist/${TAG}.js"
      - name: Commit artifact to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/${TAG}.js
          git commit -m "Release ${TAG} artifact [skip ci]"
          # rebase-retry in case main moved while we built
          for i in 1 2 3; do
            git push origin HEAD:main && break || { git pull --rebase origin main; sleep 2; }
          done
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${TAG}" "dist/${TAG}.js" \
            --title "${TAG}" \
            --notes "Artifact: https://blakeandersonziptility.github.io/ziptility-tools/dist/${TAG}.js"
