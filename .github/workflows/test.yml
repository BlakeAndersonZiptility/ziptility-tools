name: Test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Legacy v1 solver parity (until v1 is retired)
        run: npm run test:legacy
      - name: Solver tests
        run: npm test
      - name: Neutral-lane rules, no inline brand mark, sandbox safety
        # The calculator sits in the ungated tools lane: completion is the
        # conversion, a demo click is not a tools KPI, and on the live page
        # the Webflow global header and footer already carry the brand, so a
        # logo in the bundle is the brand twice on one screen. Both had
        # drifted back in (a demo CTA band in the body, dead .zip-logo CSS
        # with a comment reading "OFFICIAL LOGO SLOT"), which is why this
        # now runs in CI rather than being left to review.
        run: node scripts/check-neutral-lane.mjs src/ui
      - name: Build dev bundle
        run: npm run build:dev
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: node tests/browser.test.js
