<!-- Ziptility Operator Practice Tests: the full tool renders from this one
     script. Source: https://github.com/BlakeAndersonZiptility/ziptility-tools

     THIS FILE IS THE EMBED CONTRACT, NOT THE DEPLOY RECORD. Runtime truth
     is the live embed on the page, never this copy (LEDGER L-005). The
     version below is the one that was live when this file was last
     touched (practice-v1.3.0, measured on ziptility.com/tools/practice
     2026-07-29); to know what is serving right now, read the page.

     To deploy a new version or roll back: change ONLY the version in the
     script src, then publish. Versions are immutable, so pushing to main
     never changes what a visitor sees. Rollback is the same edit in
     reverse and takes about a minute.

     Give the Webflow wrapper around this embed the class
     .zip-practice-embed and set these min-heights on it, so nothing below
     shifts while the app boots (the dark strip is a skeleton the app
     replaces):
       desktop ~950px / tablet ~950px / mobile-landscape ~1050px /
       mobile-portrait ~1500px
     The bundle loads no third-party tags beyond its own Google Fonts
     request (Archivo + Geist).

     OPTIONS (all set on the div, or as a query string on the page URL):
       data-test="water-treatment"   pin one bank, skip the picker. Takes
                                     the page slug ("water-treatment") or
                                     the internal id ("wt-1"). See
                                     practice-embed-discipline.html for the
                                     per-discipline page this is built for.
       data-child-pages="1"          hub only: turn the six picker cards
                                     into links to /tools/practice/<slug>
                                     instead of launching in place. Leave
                                     OFF until all six pages are live, or
                                     the hub links to 404s.
       data-hub-url="/tools/practice"  override the hub path.
       data-embed="app"              in-app variant (parity with the
                                     calculator idiom; currently no visual
                                     change).
-->
