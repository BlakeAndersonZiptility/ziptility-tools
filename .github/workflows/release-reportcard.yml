name: Release Report Card
# The Utility Health Report Card (/tools/report-card): a 23-dimension TMF
# self-assessment, on its own tag family.
#
# Two ways to cut a release (both end up identical):
#   1. Actions tab -> Release Report Card -> "Run workflow" -> enter the tag.
#   2. git tag reportcard-v1.0.0 && git push origin reportcard-v1.0.0
# The workflow tests, builds dist/reportcard-vX.Y.Z.js (immutable, never
# overwritten), commits it to main, and creates a GitHub Release.
#
# UNGATED BY RULE (R14): no email for the score. The neutral-lane check
# below runs on every release, not only on PRs, because the failure mode is
# a policy breach shipped to a live page.
on:
  push:
    tags: ['reportcard-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (reportcard-vX.Y.Z, e.g. reportcard-v1.0.0)'
        required: true
permissions:
  contents: write
env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate tag and create it (manual runs only)
        run: |
          if ! echo "${TAG}" | grep -Eq '^reportcard-v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag '${TAG}' must look like reportcard-v1.0.0"; exit 1
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              echo "Tag ${TAG} already exists, versions are immutable"; exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "${TAG}"
            git push origin "${TAG}"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:reportcard
      - name: Neutral-lane rules and sandbox safety
        run: node scripts/check-neutral-lane.mjs src/reportcard
      - run: npm run build:reportcard:dev
      - name: Build versioned artifact
        run: |
          if [ -f "dist/${TAG}.js" ]; then
            echo "dist/${TAG}.js already exists, versions are immutable"; exit 1
          fi
          npx esbuild src/reportcard/main.js --bundle --format=iife --loader:.css=text --minify \
            --banner:js="/* Ziptility Utility Health Report Card ${TAG} (${GITHUB_SHA}) https://github.com/${GITHUB_REPOSITORY} */" \
            --outfile="dist/${TAG}.js"
      - name: Commit artifact to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/${TAG}.js
          git commit -m "Release ${TAG} artifact [skip ci]"
          # rebase-retry in case main moved while we built
          for i in 1 2 3; do
            git push origin HEAD:main && break || { git pull --rebase origin main; sleep 2; }
          done
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${TAG}" "dist/${TAG}.js" \
            --title "${TAG}" \
            --notes "Artifact: https://blakeandersonziptility.github.io/ziptility-tools/dist/${TAG}.js"
